name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: sdypy_io_tdms

      - name: Check out sdypy-sep005
        uses: actions/checkout@v4
        with:
          repository: OWI-Lab/sdypy-sep005-compliance
          path: sdypy-sep005-compliance

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        working-directory: sdypy_io_tdms
        run: uv sync --group ci --group test

      - name: Run pre-commit checks
        working-directory: sdypy_io_tdms
        run: uv run pre-commit run --all-files

      - name: Run tests for all supported Python versions
        working-directory: sdypy_io_tdms
        run: uv run hatch test -a
