name: Publish Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: sdypy_io_tdms

      - name: Check out sdypy-sep005
        uses: actions/checkout@v4
        with:
          repository: OWI-Lab/sdypy-sep005-compliance
          path: sdypy-sep005-compliance

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build package
        working-directory: sdypy_io_tdms
        run: uv build

      - name: Publish package
        working-directory: sdypy_io_tdms
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
